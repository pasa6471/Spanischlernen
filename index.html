<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Palabra</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ffc21a"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#fff1c1;--s:#fff;--ink:#14172b;--k:#14172b;--mu:#4a4f6a;--ac:#00b3b3;--y:#ffc21a;--r:#ff3d8b;--ok:#00875a;--no:#d6246e;--sh:#14172b;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#14172b;--s:#232850;--ink:#f6efe2;--mu:#b3b8d4;--sh:#ffc21a;--ok:#43d6a0;--no:#ff6aa8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
body::before{content:'';position:fixed;top:0;left:0;right:0;z-index:5;height:calc(14px + env(safe-area-inset-top));border-bottom:3px solid var(--k);background:repeating-linear-gradient(90deg,var(--ac) 0 30px,var(--y) 30px 38px,var(--r) 38px 44px,var(--y) 44px 52px)}
main{max-width:560px;margin:auto;padding:calc(36px + env(safe-area-inset-top)) 16px 16px}
h1{font:900 2.3rem/1.05 'Arial Black','Archivo Black',Impact,sans-serif;margin:.1em 0 .6em;letter-spacing:-.02em;text-transform:lowercase}
h1::after{content:'';display:block;width:10px;height:10px;margin:16px 0 0 4px;background:var(--y);border:2px solid var(--k);transform:rotate(45deg);box-shadow:20px 0 0 -2px var(--ac),20px 0 0 0 var(--k),40px 0 0 -2px var(--r),40px 0 0 0 var(--k)}
.mu{color:var(--mu)}.ok{color:var(--ok)}.no{color:var(--no)}.ex{font:1.2rem/1.45 Georgia,serif;margin:.3em 0 .5em}
.card{background:var(--s);border:3px solid var(--ink);border-radius:0;padding:18px 20px;margin:18px 8px 18px 0;box-shadow:7px 7px 0 var(--sh)}
.arch{border-radius:150px 150px 0 0;padding:50px 22px 20px;text-align:center}
.arch h1{font-size:3rem;margin:.05em 0 .6em}.arch h1::after{margin:16px auto 0;position:relative;left:-20px}.left{text-align:left}
.sen{margin:14px 0 0;padding-top:12px;border-top:2px dashed var(--ink)}.sen:first-of-type{border-top:0}
.tag{display:inline-block;background:var(--r);color:var(--k);border:2px solid var(--k);font-weight:900;font-size:.72rem;padding:0 8px;letter-spacing:.06em}.tag.b{background:var(--ac)}
details.card{padding:14px 18px}summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}summary::-webkit-details-marker{display:none}
summary .n{flex:none;min-width:36px;height:36px;display:grid;place-items:center;background:var(--y);color:var(--k);border:2px solid var(--k);font-weight:900;font-size:.8rem}summary .t{flex:1}
details details{margin-top:12px;border-top:2px dashed var(--ink);padding-top:10px}details details summary{font-weight:800;text-decoration:underline}
button,input{font:inherit}
button{font-weight:800;color:var(--k);background:var(--y);border:3px solid var(--ink);border-radius:0;padding:9px 16px;margin:6px 8px 6px 0;box-shadow:4px 4px 0 var(--sh);cursor:pointer}
button:active{transform:translate(4px,4px);box-shadow:none}
.pri{background:var(--r);width:calc(100% - 4px);margin:14px 0;padding:14px;font-size:1.05rem}
button.ok{background:var(--ac)}button.no{background:var(--r)}
input{width:calc(100% - 4px);padding:12px;color:var(--ink);background:var(--s);border:3px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--sh);margin:10px 0}
.row{display:flex;gap:10px}.row button{flex:1;margin:6px 4px 6px 0}
.seg{display:flex;margin:14px 8px 14px 0;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--sh)}.seg button{flex:1;margin:0;box-shadow:none;border:0;background:var(--s);color:var(--ink)}.seg button+button{border-left:3px solid var(--ink)}.seg .on{background:var(--y);color:var(--k)}.seg button:active{transform:none}
.dot{flex:none;width:14px;height:14px;border:3px solid var(--ink);background:var(--s);transform:rotate(45deg)}.dot.ok{background:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--s);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;margin:0;border:0;border-right:3px solid var(--ink);box-shadow:none;background:var(--s);color:var(--ink);padding:19px 2px 14px;position:relative}nav button:last-child{border-right:0}nav button:active{transform:none}
nav .on{background:var(--y);color:var(--k)}nav .on::after{content:'';position:absolute;left:50%;top:6px;width:8px;height:8px;margin-left:-4px;background:var(--r);border:2px solid var(--k);transform:rotate(45deg)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--r);outline-offset:3px}
select{font:inherit;font-weight:800;color:var(--k);background:var(--y);border:3px solid var(--ink);border-radius:0;padding:2px 6px;margin:0 4px;box-shadow:3px 3px 0 var(--sh)}
.q.ok{border-left:14px solid var(--ok)}.q.no{border-left:14px solid var(--no)}.pri small{display:block;font-weight:400}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.82rem;margin:6px 0 12px}td,th{border:2px solid var(--ink);padding:3px 6px;text-align:left;white-space:nowrap}th{background:var(--y);color:var(--k)}
.pri.y{background:var(--y)}.sbw{min-height:46px;margin:8px 0}.hl{background:var(--y);color:var(--k);padding:0 6px;border:2px solid var(--k)}hr{border:0;border-top:2px dashed var(--ink);margin:14px 0}button:disabled{opacity:.9}
</style></head><body><main id="v"></main><nav id="n"></nav>
<script>
const $=s=>document.querySelector(s),V=$('#v');
let W=[],S=JSON.parse(localStorage.es||'{}'),cur,rev=0,fl='alle',um='hoeren',res='',tw,lv='e';
const sv=()=>localStorage.es=JSON.stringify(S),D=864e5,IV=[1,3,7,16,40];
const nm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean);
const say=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices();u.lang='es-MX';u.rate=.85;const v=vs.find(v=>v.lang.replace('_','-')=='es-MX')||vs.find(v=>v.lang.startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)say(b.dataset.s)});
function listen(cb){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Spracherkennung fehlt in diesem Browser. Nutze Chrome (Android) oder Safari.');const r=new R();r.lang='es-MX';r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=e=>alert('Mikrofon: '+e.error);r.start()}
function cmp(t,said){const a=nm(said),miss=[];const h=t.split(' ').map(w=>{const ok=a.includes(nm(w)[0]);if(!ok)miss.push(w.replace(/[¿?¡!.,]/g,''));return `<span class="${ok?'ok':'no'}">${w}</span>`}).join(' ');return{h,miss}}
const TP=[[/rr|\br/i,'r am Wortanfang und rr: Zungenspitze rollt.'],[/j|g[ei]/i,'j, ge, gi: hauchiger Laut wie das ch in "ach".'],[/ll|y/i,'ll und y: wie das j in "Jahr".'],[/z|c[ei]/i,'z, ce, ci: einfaches s (Lateinamerika, kein Lispeln).'],[/v/i,'v: wird wie b gesprochen.'],[/h/i,'h: stumm.'],[/ñ/i,'ñ: wie nj in "Anja".'],[/qu|gu[ei]/i,'qu, gue, gui: das u bleibt stumm.']];
const GP={verbo:'Verben ändern die Endung je nach Person: yo, tú, él/ella, nosotros, ellos/ustedes. Lateinamerika: ustedes statt vosotros.',sustantivo:'Jedes Nomen ist männlich (el) oder weiblich (la). Adjektive passen sich an.',adjetivo:'Adjektive stehen meist hinter dem Nomen und passen sich an Geschlecht und Zahl an.',adverbio:'Adverbien sind unveränderlich und stehen meist beim Verb.',conjunción:'Bindewörter verbinden Sätze und bleiben unverändert.',otros:'Feste Wendung, unverändert.'};
const gr=w=>`<details><summary>Grammatik</summary><p class=mu>${w.g||GP[w.p]}</p></details>`;
function nextW(){const n=Date.now();return W.filter(w=>S[w.w]&&S[w.w].due<=n).sort((a,b)=>S[a.w].due-S[b.w].due)[0]||W.find(w=>!S[w.w])||W[0]}
const lvT={e:'A2',e2:'B2'},dk={e:'d',e2:'d2'};
const sentence=(w,r)=>['e','e2'].map(l=>`<div class=sen><span class="tag ${l=='e2'?'b':''}">${lvT[l]}</span><p class=ex>${w[l]}</p>${r?`<p class=mu>${w[dk[l]]}</p>`:''}<button data-s="${w[l]}">Anhören</button></div>`).join('');
function lernen(){cur=cur||nextW();const w=cur,g=Object.values(S).filter(x=>x.lv>=1).length;
V.innerHTML=`<p class=mu>${g} von ${W.length} gelernt</p><div class="card arch"><p class=mu>${w.p}, Rang ${W.indexOf(w)+1}</p><h1>${w.w}</h1><button data-s="${w.w}">Wort anhören</button>${rev?`<p><b>${w.t}</b></p>`:''}<div class=left>${sentence(w,rev)}${gr(w)}</div></div>`+(rev?`<div class=row><button class=no onclick=ans(0)>Nochmal</button><button class=ok onclick=ans(1)>Gewusst</button></div>`:`<button class=pri onclick="rev=1;lernen()">Übersetzung zeigen</button>`)}
function ans(k){const w=cur.w,lv=k?(S[w]?S[w].lv:0)+1:0;S[w]={lv,due:Date.now()+(k?IV[Math.min(lv-1,4)]*D:6e5)};sv();cur=null;rev=0;lernen()}
function woerter(){const k=w=>S[w.w]&&S[w.w].lv>=1;
V.innerHTML=`<h1>Wörter</h1><div class=seg>${['alle','offen','gelernt'].map(f=>`<button class="${f==fl?'on':''}" onclick="fl='${f}';woerter()">${f}</button>`).join('')}</div>`+W.map((w,i)=>[w,i]).filter(([w])=>fl=='alle'||(fl=='gelernt')==!!k(w)).map(([w,i])=>`<details class=card><summary><span class=n>${i+1}</span><span class=t><b>${w.w}</b> <span class=mu>${w.t}</span></span><i class="dot ${k(w)?'ok':''}"></i></summary>${sentence(w,1)}${gr(w)}</details>`).join('')+`<button class=no onclick="confirm('Fortschritt löschen?')&&(S={},sv(),cur=null,woerter())">Fortschritt zurücksetzen</button>`}
function chk(said){const t=tw[lv],c=cmp(t,said);res=`<p class=ex>${c.h}</p><p class=mu>${tw[dk[lv]]}</p>`+(c.miss.length?`<p>Abweichungen: <b>${c.miss.join(', ')}</b>. Höre den Satz noch einmal und achte auf diese Wörter.</p>`:'<p class=ok><b>Richtig.</b></p>')+(um=='sprechen'?`<p class=mu>Erkannt: ${said}</p>`+TP.filter(x=>x[0].test(t)).map(x=>`<p class=mu>${x[1]}</p>`).join(''):'');ueben()}
function ueben(nw){if(nw||!tw){tw=W[Math.floor(Math.random()*W.length)];res=''}const h=um=='hoeren',t=tw[lv],sg=(a,v,f)=>`<div class=seg>${a.map(([k,x])=>`<button class="${k==v?'on':''}" onclick="${f(k)}">${x}</button>`).join('')}</div>`;
V.innerHTML=`<h1>Üben</h1>`+sg([['hoeren','Hören'],['sprechen','Sprechen']],um,k=>`um='${k}';res='';ueben()`)+sg([['e','A2'],['e2','B2']],lv,k=>`lv='${k}';res='';ueben()`)+`<div class=card>`+(h?`<button class=pri data-s="${t}">Satz abspielen</button><input id=i placeholder="Was hast du gehört?" autocapitalize=off><button onclick="chk($('#i').value)">Prüfen</button>`:`<p class=ex>${t}</p><p class=mu>${tw[dk[lv]]}</p><button data-s="${t}">Vorbild anhören</button><button class=pri onclick="listen(chk)">Satz sprechen</button>`)+`<div>${res}</div></div><button onclick="ueben(1)">Nächster Satz</button>`}
let EX=[],es=null,ea={},ech=0;
fetch('exercises.json').then(r=>r.json()).then(d=>{EX=d;EX.forEach((x,i)=>x.s.forEach((q,j)=>q.k=i+':'+j))});
const qh=(q,i)=>{const r=ech?(ea[i]===q.a?'ok':'no'):'',sel=`<select ${ech?'disabled':''} onchange="ea[${i}]=this.value===''?undefined:+this.value"><option value="">...</option>${q.o.map((o,j)=>`<option value=${j} ${ea[i]===j?'selected':''}>${o}</option>`).join('')}</select>`;
return `<div class="card q ${r}"><p class=ex>${q.q.replace('___',sel)}</p>${ech?`<p class=${r}><b>${r=='ok'?'Richtig':'Falsch, richtig ist: '+q.o[q.a]}</b></p><p class=mu>${q.x}</p>`:''}</div>`};
const CJ=`ser|Presente|soy,eres,es,somos,son
ser|Indefinido|fui,fuiste,fue,fuimos,fueron
ser|Imperfecto|era,eras,era,éramos,eran
estar|Presente|estoy,estás,está,estamos,están
estar|Indefinido|estuve,estuviste,estuvo,estuvimos,estuvieron
estar|Imperfecto|estaba,estabas,estaba,estábamos,estaban
ir|Presente|voy,vas,va,vamos,van
ir|Indefinido|fui,fuiste,fue,fuimos,fueron
ir|Imperfecto|iba,ibas,iba,íbamos,iban
tener|Presente|tengo,tienes,tiene,tenemos,tienen
tener|Indefinido|tuve,tuviste,tuvo,tuvimos,tuvieron
tener|Imperfecto|tenía,tenías,tenía,teníamos,tenían
hacer|Presente|hago,haces,hace,hacemos,hacen
hacer|Indefinido|hice,hiciste,hizo,hicimos,hicieron
hacer|Imperfecto|hacía,hacías,hacía,hacíamos,hacían
poder|Presente|puedo,puedes,puede,podemos,pueden
poder|Indefinido|pude,pudiste,pudo,pudimos,pudieron
poder|Imperfecto|podía,podías,podía,podíamos,podían
querer|Presente|quiero,quieres,quiere,queremos,quieren
querer|Indefinido|quise,quisiste,quiso,quisimos,quisieron
querer|Imperfecto|quería,querías,quería,queríamos,querían
hablar|Presente|hablo,hablas,habla,hablamos,hablan
hablar|Indefinido|hablé,hablaste,habló,hablamos,hablaron
hablar|Imperfecto|hablaba,hablabas,hablaba,hablábamos,hablaban
comer|Presente|como,comes,come,comemos,comen
comer|Indefinido|comí,comiste,comió,comimos,comieron
comer|Imperfecto|comía,comías,comía,comíamos,comían
vivir|Presente|vivo,vives,vive,vivimos,viven
vivir|Indefinido|viví,viviste,vivió,vivimos,vivieron
vivir|Imperfecto|vivía,vivías,vivía,vivíamos,vivían
decir|Presente|digo,dices,dice,decimos,dicen
decir|Indefinido|dije,dijiste,dijo,dijimos,dijeron
decir|Imperfecto|decía,decías,decía,decíamos,decían`.split('\n').map(l=>{const a=l.split('|');return{v:a[0],t:a[1],f:a[2].split(',')}}),PN=['yo','tú','él/ella','nosotros','ellos/ustedes'];
let gm=null,rv,cj,sb,fj,er=JSON.parse(localStorage.er||'{}');
const miss=(k,ok)=>{if(ok){if(er[k]&&!--er[k])delete er[k]}else er[k]=(er[k]||0)+1;localStorage.er=JSON.stringify(er)},rnd=a=>a[Math.floor(Math.random()*a.length)],sec=()=>es==='r'?rv:EX[es],rec=()=>sec().s.forEach((q,i)=>miss(q.k,ea[i]===q.a)),back=`<button onclick="gm=null;es=null;gram()">Alle Themen</button>`;
const mkrv=()=>({n:'Fehler wiederholen',r:'<p>Hier stehen deine schwächsten Aufgaben. Richtig gelöste werden seltener, falsche häufiger gezeigt.</p>',s:EX.flatMap(x=>x.s).filter(q=>er[q.k]).sort((a,b)=>er[b.k]-er[a.k]).slice(0,10)});
function konj(n){if(n||!cj){const P=[];CJ.forEach((c,i)=>PN.forEach((_,p)=>{for(let r=0;r<(er['c:'+i+':'+p]?4:1);r++)P.push([i,p])}));const[i,p]=rnd(P);cj={i,p,a:'',done:0}}const c=CJ[cj.i],p=cj.p;
V.innerHTML=back+`<h1>Konjugation</h1><div class=card><p class=mu>${c.t}</p><p class=ex><b>${c.v}</b>, ${PN[p]}</p><input id=cv autocapitalize=off autocomplete=off value="${cj.a}" ${cj.done?'disabled':''}>`+(cj.done?`<p class=${cj.ok?'ok':'no'}><b>${cj.ok?'Richtig':'Falsch, richtig ist: '+c.f[p]}</b></p>${!cj.ok&&nm(cj.a).join()==nm(c.f[p]).join()?'<p class=mu>Fast: nur ein Akzent fehlt oder ist falsch. Beispiel: hablo (Präsens) und habló (Indefinido).</p>':''}<button class=pri onclick="konj(1)">Weiter</button>`:`<button class=pri onclick="kchk()">Prüfen</button>`)+`</div>`}
function kchk(){cj.a=$('#cv').value.trim().toLowerCase();cj.ok=cj.a==CJ[cj.i].f[cj.p];cj.done=1;miss('c:'+cj.i+':'+cj.p,cj.ok);konj()}
function satz(n){if(n||!sb){const w=rnd(W),l=rnd(['e','e2']),t=w[l],a=t.split(' ');sb={t,d:w[dk[l]],a,p:a.map((x,i)=>i).sort(()=>Math.random()-.5),u:[],done:0}}const b=sb;
V.innerHTML=back+`<h1>Satzbau</h1><div class=card><p class=mu>${b.d}</p><div class=sbw>${b.u.map(i=>`<button class=ok ${b.done?'disabled':''} onclick="sbm(${i},1)">${b.a[i]}</button>`).join('')||'<span class=mu>Tippe die Wörter in der richtigen Reihenfolge an.</span>'}</div><hr><div>${b.p.filter(i=>!b.u.includes(i)).map(i=>`<button onclick="sbm(${i},0)">${b.a[i]}</button>`).join('')}</div>`+(b.done?`<hr><p class=${b.ok?'ok':'no'}><b>${b.ok?'Richtig':'Nicht ganz'}</b></p><p class=ex>${b.t}</p>${b.ok?'':'<p class=mu>Manchmal ist auch eine andere Reihenfolge möglich. Vergleiche mit dem Vorbild.</p>'}<button data-s="${b.t}">Anhören</button><button class=pri onclick="satz(1)">Weiter</button>`:b.u.length==b.a.length?`<button class=pri onclick="sb.done=1;sb.ok=sb.u.map(i=>sb.a[i]).join(' ')==sb.t;satz()">Prüfen</button>`:'')+`</div>`}
function sbm(i,r){sb.u=r?sb.u.filter(x=>x!=i):[...sb.u,i];satz()}
function fjag(n){if(n||!fj){const x=rnd(EX),q=rnd(x.s),good=Math.random()<.5;fj={q,good,o:good?q.a:rnd(q.o.map((_,k)=>k).filter(k=>k!=q.a)),done:0}}const q=fj.q;
V.innerHTML=back+`<h1>Richtig oder falsch?</h1><div class=card><p class=ex>${q.q.replace('___','<b class=hl>'+q.o[fj.o]+'</b>')}</p>`+(fj.done?`<p class=${fj.ok?'ok':'no'}><b>${fj.ok?'Richtig eingeschätzt':'Leider falsch eingeschätzt'}</b></p><p>${fj.good?'Der Satz ist richtig.':'Der Satz ist falsch, richtig wäre: <b>'+q.o[q.a]+'</b>.'}</p><p class=mu>${q.x}</p><button class=pri onclick="fjag(1)">Weiter</button>`:`<div class=row><button class=ok onclick="fj2(1)">Richtig</button><button class=no onclick="fj2(0)">Falsch</button></div>`)+`</div>`}
function fj2(a){fj.done=1;fj.ok=!!a==fj.good;miss(fj.q.k,fj.ok);fjag()}
function gram(){if(gm=='k')return konj();if(gm=='s')return satz();if(gm=='f')return fjag();
if(es===null){const n=Object.keys(er).filter(k=>/^\d/.test(k)).length;V.innerHTML=`<h1>Grammatik</h1><p class=mu>Themen</p>`+EX.map((x,i)=>`<button class=pri onclick="es=${i};ea={};ech=0;gram()">${x.n}<small>${x.s.length} Aufgaben</small></button>`).join('')+`<p class=mu>Trainingsarten</p>`+[['k','Konjugation tippen','Formen selbst schreiben'],['s','Satzbau','Wörter in die richtige Reihenfolge bringen'],['f','Richtig oder falsch?','Fehler in Sätzen erkennen']].map(([k,t,d])=>`<button class="pri y" onclick="gm='${k}';gram()">${t}<small>${d}</small></button>`).join('')+`<button class="pri y" onclick="rv=mkrv();es='r';ea={};ech=0;gram()">Fehler wiederholen<small>${n} offene Aufgaben</small></button>`;return}
const x=sec(),sc=x.s.filter((q,i)=>ea[i]===q.a).length;
V.innerHTML=back+`<h1>${x.n}</h1>`+(x.s.length?`<details class=card><summary><b>Merkkasten</b></summary>${x.r}</details>`+(ech?`<div class=card><p class=ex><b>${sc} von ${x.s.length} richtig</b></p><button onclick="ea={};ech=0;gram()">Nochmal</button></div>`:'')+x.s.map(qh).join('')+(ech?'':`<button class=pri onclick="ech=1;rec();gram();scrollTo(0,0)">Prüfen</button>`):'<p class=ex>Keine offenen Fehler. Löse zuerst ein paar Themen oder Fehlerjagd-Aufgaben.</p>')}
const T={lernen,woerter,ueben,gram},L={lernen:'Lernen',woerter:'Wörter',ueben:'Üben',gram:'Grammatik'};
function go(t){T[t]();$('#n').innerHTML=Object.keys(T).map(k=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${L[k]}</button>`).join('')}
fetch('words.json').then(r=>r.json()).then(d=>{W=d;go('lernen')});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
