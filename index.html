<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Palabra</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ffb400"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff4de;--s:#fff;--ink:#231942;--k:#231942;--y:#ffb400;--t:#0a7f7b;--m:#c2185b;--mu:#5a5073;--ln:#ecdcb8;--tt:#0a7f7b;--mm:#c2185b;color-scheme:light dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 'Rubik',system-ui,sans-serif}
#app{max-width:560px;margin:auto;padding-bottom:110px}
#hd{background:var(--y);color:var(--k);padding:calc(28px + env(safe-area-inset-top)) 24px 26px;min-height:230px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font-weight:800;font-size:13px;letter-spacing:.18em}
#ht{margin-top:auto}
h1{font:800 clamp(2.6rem,15vw,4.8rem)/1 'Rubik',system-ui,sans-serif;letter-spacing:-.03em;margin:16px 0 0;overflow-wrap:anywhere}
h1 .meta{display:block;font-weight:500;font-size:15px;letter-spacing:0;margin-bottom:6px}
#sc{height:14px;background:radial-gradient(circle at 50% 0,var(--y) 0 13px,transparent 14px) 0 0/28px 14px repeat-x}
main{padding:22px 24px}
.mu,small{color:var(--mu)}.ok{color:var(--tt)}.no{color:var(--mm)}small{display:block}
.ex{font-size:19px;line-height:1.4;margin:0 0 6px}
button{font:800 15px 'Rubik',system-ui,sans-serif;background:var(--k);color:var(--y);border:0;border-radius:12px;padding:11px 20px;margin:4px 8px 4px 0;cursor:pointer}
button:active{transform:scale(.97)}.sm{padding:6px 12px;font-size:13px}
.pri{background:var(--m);color:#fff;width:100%;height:58px;border-radius:16px;font-size:17px;margin:16px 0}
.pri.y{background:var(--y);color:var(--k);height:auto;padding:14px 20px;text-align:left}.pri small{color:inherit;font-weight:500}
button.ok{background:var(--t);color:#fff}button.no{background:var(--m);color:#fff}
.row{display:flex;gap:10px}.row button{flex:1;margin:6px 0}
.card{background:var(--s);border-radius:20px;padding:18px 20px;margin:14px 0}
.sen{display:flex;gap:14px;align-items:flex-start;margin:18px 0}.sen>div{flex:1}
.tag{flex:none;background:var(--t);color:#fff;font:800 12px 'Rubik',sans-serif;padding:5px 9px;border-radius:8px}.tag.b{background:var(--k)}
details.card{padding:14px 18px}summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}summary::-webkit-details-marker{display:none}summary .t{flex:1}
.n{flex:none;min-width:44px;height:32px;display:grid;place-items:center;background:var(--y);color:var(--k);border-radius:8px;font-weight:800;font-size:.8rem;padding:0 6px}
details details{margin-top:12px;border-top:2px dashed var(--ln);padding-top:10px}details details summary{font-weight:800;text-decoration:underline}
input{width:100%;padding:13px 16px;font:inherit;color:var(--ink);background:var(--s);border:2px solid var(--k);border-radius:12px;margin:8px 0}
select{font:800 1rem 'Rubik',sans-serif;background:var(--y);color:var(--k);border:0;border-radius:8px;padding:3px 8px;margin:0 4px}
.seg{display:flex;background:var(--k);border-radius:16px;padding:5px;gap:4px;margin:14px 0}.seg button{flex:1;margin:0;background:none;color:#fff4de}.seg .on{background:var(--y);color:var(--k)}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--mu)}.dot.ok{background:var(--t);border-color:var(--t)}
.q.ok{box-shadow:inset 8px 0 var(--t)}.q.no{box-shadow:inset 8px 0 var(--m)}.hl{background:var(--y);color:var(--k);padding:0 6px;border-radius:4px}
hr{border:0;border-top:2px dashed var(--ln);margin:14px 0}.sbw{min-height:46px;margin:8px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.82rem;margin:6px 0 12px}td,th{padding:5px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--ln)}th{background:var(--y);color:var(--k)}
nav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:528px;margin:auto;background:var(--k);border-radius:20px;display:flex;padding:6px;gap:4px;z-index:9}
nav button{flex:1;height:48px;margin:0;padding:0;border-radius:14px;background:none;color:#fff4de;font-size:.88rem}nav .on{background:var(--y);color:var(--k)}
button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--m);outline-offset:2px}

<script type="application/json" id="dv">[{"w":"el","p":"determinante","r":1},{"w":"de","p":"preposición","r":2},{"w":"que","p":"conjunción","r":3},{"w":"ser","p":"verbo","r":4,"c":[["soy","eres","es","somos","son"],["fui","fuiste","fue","fuimos","fueron"],1],"g":"Ser für Identität, Herkunft, Beruf, Eigenschaften: soy, eres, es, somos, son. Für Zustände und Orte nimmt man estar.","t":"sein (dauerhaft)","e":"Soy de México.","d":"Ich komme aus Mexiko.","e2":"Aunque sea difícil, quiero ser honesto contigo.","d2":"Auch wenn es schwer ist, will ich ehrlich zu dir sein."},{"w":"él","p":"pronombre","r":5},{"w":"no","p":"adverbio","r":6},{"w":"uno","p":"determinante","r":7},{"w":"a","p":"preposición","r":8},{"w":"yo","p":"pronombre","r":9},{"w":"estar","p":"verbo","r":10,"c":[["estoy","estás","está","estamos","están"],["estuve","estuviste","estuvo","estuvimos","estuvieron"],1],"g":"Estar für Orte und vorübergehende Zustände. Está cansado = er ist gerade müde; es aburrido = er ist von Natur aus langweilig.","t":"sein (Zustand, Ort)","e":"Estoy en casa ahora.","d":"Ich bin jetzt zu Hause.","e2":"Si estuviera en tu lugar, no estaría tan tranquilo.","d2":"Wenn ich an deiner Stelle wäre, wäre ich nicht so ruhig."},{"w":"y","p":"conjunción","r":11},{"w":"en","p":"preposición","r":12},{"w":"haber","p":"verbo","r":13,"c":[["he","has","hay","hemos","han"],["hube","hubiste","hubo","hubimos","hubieron"],1],"g":"Unregelmäßiges Verb. Achte auf die Stammänderung oder die yo-Form."},{"w":"tú","p":"pronombre","r":14},{"w":"por","p":"preposición","r":15},{"w":"tener","p":"verbo","r":16,"c":[["tengo","tienes","tiene","tenemos","tienen"],["tuve","tuviste","tuvo","tuvimos","tuvieron"],1],"g":"Tener que + Infinitiv = müssen: Tengo que trabajar. Auch fürs Alter: Tengo treinta años.","t":"haben","e":"Tengo dos hermanos.","d":"Ich habe zwei Geschwister.","e2":"Tuve que cancelar el viaje porque no tenía suficiente dinero.","d2":"Ich musste die Reise absagen, weil ich nicht genug Geld hatte."},{"w":"qué","p":"pronombre","r":17},{"w":"este","p":"determinante","r":18},{"w":"ese","p":"pronombre","r":19},{"w":"ir","p":"verbo","r":20,"c":[["voy","vas","va","vamos","van"],["fui","fuiste","fue","fuimos","fueron"],1],"g":"Ir a + Infinitiv bildet die nahe Zukunft: voy a, vas a, va a, vamos a, van a.","t":"gehen, fahren","e":"Voy a comprar pan.","d":"Ich werde Brot kaufen.","e2":"Si tuviera más tiempo, iría contigo al norte del país.","d2":"Hätte ich mehr Zeit, würde ich mit dir in den Norden des Landes fahren."},{"w":"poder","p":"verbo","r":21,"c":[["puedo","puedes","puede","podemos","pueden"],["pude","pudiste","pudo","pudimos","pudieron"],1],"g":"Stammvokal o wird zu ue (puedo, puedes), bei nosotros nicht: podemos. Danach steht der Infinitiv.","t":"können","e":"¿Puedes ayudarme?","d":"Kannst du mir helfen?","e2":"No pude llamarte porque se me acabó la batería.","d2":"Ich konnte dich nicht anrufen, weil mein Akku leer war."},{"w":"con","p":"preposición","r":22},{"w":"para","p":"preposición","r":23},{"w":"mi","p":"determinante","r":24},{"w":"hacer","p":"verbo","r":25,"c":[["hago","haces","hace","hacemos","hacen"],["hice","hiciste","hizo","hicimos","hicieron"],1],"g":"Unregelmäßiges Verb. Achte auf die Stammänderung oder die yo-Form.","t":"machen, tun","e":"¿Qué haces hoy?","d":"Was machst du heute?","e2":"Hace años que no hago ejercicio, pero quiero volver a empezar.","d2":"Seit Jahren treibe ich keinen Sport, will aber wieder anfangen."},{"w":"su","p":"determinante","r":26},{"w":"saber","p":"verbo","r":27,"c":[["sé","sabes","sabe","sabemos","saben"],["supe","supiste","supo","supimos","supieron"],1],"g":"Saber = Wissen oder gelernte Fähigkeit (Sé nadar). Conocer = Personen und Orte kennen.","t":"wissen, können","e":"No sé dónde está.","d":"Ich weiß nicht, wo es ist.","e2":"Nadie sabe cuándo terminará la obra en la calle.","d2":"Niemand weiß, wann die Baustelle in der Straße fertig wird."},{"w":"todo","p":"adjetivo","r":28,"t":"alles, ganz","e":"Todo está bien.","d":"Alles ist gut.","e2":"Todo lo que dijo resultó ser cierto.","d2":"Alles, was er sagte, erwies sich als wahr."},{"w":"pero","p":"conjunción","r":29,"t":"aber","e":"Quiero ir, pero no puedo.","d":"Ich will gehen, aber ich kann nicht.","e2":"Entiendo tu postura, pero no estoy de acuerdo.","d2":"Ich verstehe deinen Standpunkt, bin aber nicht einverstanden."},{"w":"si","p":"conjunción","r":30},{"w":"decir","p":"verbo","r":31,"c":[["digo","dices","dice","decimos","dicen"],["dije","dijiste","dijo","dijimos","dijeron"],1],"g":"Unregelmäßiges Verb. Achte auf die Stammänderung oder die yo-Form.","t":"sagen","e":"Dice que viene mañana.","d":"Er sagt, dass er morgen kommt.","e2":"Me dijeron que la reunión se había cancelado.","d2":"Man sagte mir, das Treffen sei abgesagt worden."},{"w":"bien","p":"adverbio","r":32,"t":"gut","e":"Hablas muy bien.","d":"Du sprichst sehr gut.","e2":"Le salió bien el examen pese a no haber dormido.","d2":"Die Prüfung lief gut, obwohl er nicht geschlafen hatte.","g":"Bien ist ein Adverb beim Verb (hablas bien), bueno ein Adjektiv beim Nomen (un libro bueno)."},{"w":"mucho","p":"adjetivo","r":33,"t":"viel","e":"Hay mucha gente aquí.","d":"Hier sind viele Leute.","e2":"A pesar de que había mucha gente, encontramos una mesa.","d2":"Obwohl viele Leute da waren, fanden wir einen Tisch.","g":"Als Adjektiv passt es sich an: mucha gente, muchos libros. Beim Verb bleibt es gleich: trabajo mucho."},{"w":"tu","p":"determinante","r":34},{"w":"querer","p":"verbo","r":35,"c":[["quiero","quieres","quiere","queremos","quieren"],["quise","quisiste","quiso","quisimos","quisieron"],1],"g":"Quiero que + subjuntivo, wenn eine andere Person handeln soll: Quiero que vengas. Gleiche Person: Quiero venir (Infinitiv).","t":"wollen, mögen","e":"Quiero un café, por favor.","d":"Ich möchte einen Kaffee, bitte.","e2":"Quería que me explicaras cómo funciona esto.","d2":"Ich wollte, dass du mir erklärst, wie das funktioniert."},{"w":"del","p":"preposición","r":36},{"w":"ver","p":"verbo","r":37,"c":[["veo","ves","ve","vemos","ven"],["vi","viste","vio","vimos","vieron"],1],"g":"Unregelmäßiges Verb. Achte auf die Stammänderung oder die yo-Form.","t":"sehen","e":"Veo la tele por la noche.","d":"Abends sehe ich fern.","e2":"Ayer vi a un viejo amigo que no veía desde hacía diez años.","d2":"Gestern sah ich einen alten Freund, den ich seit zehn Jahren nicht gesehen hatte."},{"w":"como","p":"conjunción","r":38},{"w":"aquí","p":"adverbio","r":39,"t":"hier","e":"¿Vives aquí?","d":"Wohnst du hier?","e2":"Aquí es donde empezó todo hace veinte años.","d2":"Hier hat vor zwanzig Jahren alles begonnen."},{"w":"al","p":"preposición","r":40},{"w":"más","p":"adverbio","r":41},{"w":"ya","p":"adverbio","r":42,"t":"schon, bereits","e":"Ya terminé el trabajo.","d":"Ich habe die Arbeit schon beendet.","e2":"Ya no tiene sentido seguir discutiendo.","d2":"Es hat keinen Sinn mehr, weiter zu streiten."},{"w":"ahora","p":"adverbio","r":43,"t":"jetzt","e":"Ahora estoy ocupado.","d":"Jetzt bin ich beschäftigt.","e2":"Ahora que lo pienso, tienes toda la razón.","d2":"Jetzt, wo ich darüber nachdenke, hast du völlig recht."},{"w":"así","p":"adverbio","r":44},{"w":"algo","p":"pronombre","r":45},{"w":"bueno","p":"adjetivo","r":46,"g":"Vor männlichem Nomen verkürzt: un buen día.","t":"gut","e":"Este restaurante es muy bueno.","d":"Dieses Restaurant ist sehr gut.","e2":"Está bien, pero no creo que sea la mejor opción.","d2":"Schon gut, aber ich glaube nicht, dass es die beste Option ist."},{"w":"creer","p":"verbo","r":47,"c":[["creo","crees","cree","creemos","creen"],["creí","creíste","creyó","creímos","creyeron"],1],"g":"Creo que + Indikativ. In der Verneinung folgt der subjuntivo: No creo que sea verdad.","t":"glauben","e":"Creo que tienes razón.","d":"Ich glaube, du hast recht.","e2":"No creo que haya tomado la decisión correcta.","d2":"Ich glaube nicht, dass er die richtige Entscheidung getroffen hat."},{"w":"vez","p":"sustantivo","r":48,"g":"Plural: veces. A veces = manchmal; otra vez = nochmal.","t":"Mal","e":"Es la primera vez que vengo.","d":"Ich komme zum ersten Mal.","e2":"Esta vez no pienso cometer el mismo error.","d2":"Diesmal werde ich nicht denselben Fehler machen."},{"w":"cuando","p":"conjunción","r":49,"t":"wenn, als","e":"Llámame cuando llegues.","d":"Ruf mich an, wenn du ankommst.","e2":"Cuando termine el curso, buscaré trabajo en el extranjero.","d2":"Wenn der Kurs vorbei ist, suche ich Arbeit im Ausland.","g":"Cuando + subjuntivo, wenn die Handlung in der Zukunft liegt: cuando llegues. Bei Gewohnheit Indikativ: cuando llego, tomo café."},{"w":"nada","p":"pronombre","r":50},{"w":"cómo","p":"pronombre","r":51},{"w":"o","p":"conjunción","r":52},{"w":"pasar","p":"verbo","r":53,"t":"passieren, verbringen","e":"¿Qué pasó ayer?","d":"Was ist gestern passiert?","e2":"Aunque pase lo que pase, cuenta conmigo.","d2":"Was auch geschieht, du kannst auf mich zählen."},{"w":"otro","p":"adjetivo","r":54,"t":"anderer","e":"Quiero otro café.","d":"Ich möchte noch einen Kaffee.","e2":"Cada uno tiene su opinión, y la del otro merece respeto.","d2":"Jeder hat seine Meinung, und die des anderen verdient Respekt.","g":"Kein Artikel vor otro: otro café, nicht un otro café."},{"w":"tanto","p":"adverbio","r":55},{"w":"deber","p":"verbo","r":56,"c":[["debo","debes","debe","debemos","deben"],["debí","debiste","debió","debimos","debieron"],0],"g":"Deber + Infinitiv drückt eine Pflicht oder einen Rat aus, milder als tener que.","t":"müssen, sollen","e":"Debes descansar más.","d":"Du solltest mehr ausruhen.","e2":"Deberías haberme avisado antes de tomar esa decisión.","d2":"Du hättest mir Bescheid sagen sollen, bevor du diese Entscheidung getroffen hast."},{"w":"gracias","p":"otros","r":57,"g":"Geschlecht merken (el oder la). Plural: +es nach Konsonant.","t":"danke","e":"Muchas gracias por tu ayuda.","d":"Vielen Dank für deine Hilfe.","e2":"Gracias a tu consejo, evité un grave problema.","d2":"Dank deines Rates habe ich ein ernstes Problem vermieden."},{"w":"hablar","p":"verbo","r":58,"c":[["hablo","hablas","habla","hablamos","hablan"],["hablé","hablaste","habló","hablamos","hablaron"],0],"g":"Regelmäßiges Verb auf -ar.","t":"sprechen","e":"Hablo un poco de español.","d":"Ich spreche ein bisschen Spanisch.","e2":"Me gustaría hablar con fluidez antes de viajar a Colombia.","d2":"Ich würde gern fließend sprechen, bevor ich nach Kolumbien reise."},{"w":"sólo","p":"adverbio","r":59},{"w":"dar","p":"verbo","r":60,"c":[["doy","das","da","damos","dan"],["di","diste","dio","dimos","dieron"],1],"g":"Unregelmäßiges Verb. Achte auf die Stammänderung oder die yo-Form.","t":"geben","e":"Te doy mi número.","d":"Ich gebe dir meine Nummer.","e2":"Me dio mucha pena que no me avisaras antes.","d2":"Es tat mir sehr leid, dass du mir nicht früher Bescheid gegeben hast."},{"w":"esperar","p":"verbo","r":61,"c":[["espero","esperas","espera","esperamos","esperan"],["esperé","esperaste","esperó","esperamos","esperaron"],0],"g":"Espero que + subjuntivo: Espero que vengas. Als warten: Espero el bus.","t":"warten, hoffen","e":"Espero que vengas pronto.","d":"Ich hoffe, du kommst bald.","e2":"Esperaba que me dieran una respuesta antes del viernes.","d2":"Ich hatte gehofft, man würde mir vor Freitag antworten."},{"w":"solo","p":"adjetivo","r":62,"g":"Weiblich -a, Plural -os/-as."},{"w":"venir","p":"verbo","r":63,"c":[["vengo","vienes","viene","venimos","vienen"],["vine","viniste","vino","vinimos","vinieron"],1],"g":"Unregelmäßiges Verb. Achte auf die Stammänderung oder die yo-Form.","t":"kommen","e":"¿Vienes a la fiesta?","d":"Kommst du zur Party?","e2":"Cuando vengas a visitarme, te llevaré a conocer el centro.","d2":"Wenn du mich besuchen kommst, zeige ich dir die Innenstadt."},{"w":"sentir","p":"verbo","r":64,"c":[["siento","sientes","siente","sentimos","sienten"],["sentí","sentiste","sintió","sentimos","sintieron"],1],"g":"Sentirse = sich fühlen: Me siento bien.","t":"fühlen","e":"Siento mucho frío.","d":"Mir ist sehr kalt.","e2":"Siento que no me están escuchando.","d2":"Ich habe das Gefühl, dass man mir nicht zuhört."},{"w":"cosa","p":"sustantivo","r":65,"g":"Endet auf -a: meist weiblich (la), Plural -as.","t":"Sache","e":"Tengo muchas cosas que hacer.","d":"Ich habe viele Dinge zu tun.","e2":"Lo primero es tener claras las cosas que de verdad importan.","d2":"Zuerst muss man sich klar machen, was wirklich zählt."},{"w":"porque","p":"conjunción","r":66,"t":"weil","e":"No voy porque estoy cansado.","d":"Ich gehe nicht, weil ich müde bin.","e2":"No lo compré porque me pareció demasiado caro.","d2":"Ich habe es nicht gekauft, weil es mir zu teuer vorkam.","g":"Porque = weil. Por qué (zwei Wörter, mit Akzent) = warum."},{"w":"pensar","p":"verbo","r":67,"c":[["pienso","piensas","piensa","pensamos","piensan"],["pensé","pensaste","pensó","pensamos","pensaron"],1],"g":"Pensar en = an etwas denken. Pensar + Infinitiv = vorhaben: Pienso viajar en verano.","t":"denken","e":"Pienso en mi familia.","d":"Ich denke an meine Familie.","e2":"Pensándolo bien, creo que deberíamos esperar un poco.","d2":"Wenn ich es mir recht überlege, sollten wir ein bisschen warten."},{"w":"nuestro","p":"determinante","r":68},{"w":"día","p":"sustantivo","r":69,"g":"El día ist männlich, obwohl es auf -a endet. Gruß: buenos días, buenas tardes, buenas noches.","t":"Tag","e":"Buen día, ¿cómo estás?","d":"Guten Tag, wie geht's?","e2":"Por mucho que trabaje, siempre me faltan horas al día.","d2":"Egal wie viel ich arbeite, mir fehlen immer Stunden am Tag."},{"w":"trabajar","p":"verbo","r":70,"c":[["trabajo","trabajas","trabaja","trabajamos","trabajan"],["trabajé","trabajaste","trabajó","trabajamos","trabajaron"],0],"g":"Regelmäßiges Verb auf -ar.","t":"arbeiten","e":"Trabajo en una oficina.","d":"Ich arbeite in einem Büro.","e2":"Trabajo por cuenta propia desde que dejé la empresa.","d2":"Ich arbeite selbstständig, seit ich die Firma verlassen habe."},{"w":"usted","p":"pronombre","r":71},{"w":"hombre","p":"sustantivo","r":72,"g":"Geschlecht merken (el oder la). Plural: +es nach Konsonant.","t":"Mann","e":"Ese hombre es mi tío.","d":"Dieser Mann ist mein Onkel.","e2":"Es un hombre de pocas palabras pero de gran corazón.","d2":"Er ist ein Mann weniger Worte, aber mit großem Herzen."},{"w":"entonces","p":"adverbio","r":73,"t":"dann, also","e":"Entonces, ¿qué hacemos?","d":"Also, was machen wir?","e2":"Si ya lo sabías, entonces ¿por qué no dijiste nada?","d2":"Wenn du es schon wusstest, warum hast du dann nichts gesagt?"},{"w":"casa","p":"sustantivo","r":74,"g":"Endet auf -a: meist weiblich (la), Plural -as.","t":"Haus, Zuhause","e":"Mi casa está cerca.","d":"Mein Haus ist in der Nähe.","e2":"Dejé mi casa en manos de unos vecinos mientras viajaba.","d2":"Ich ließ mein Haus in der Obhut von Nachbarn, während ich verreist war."},{"w":"holar","p":"verbo","r":75,"c":[["holo","holas","hola","holamos","holan"],["holé","holaste","holó","holamos","holaron"],0],"g":"Regelmäßiges Verb auf -ar."},{"w":"verdad","p":"sustantivo","r":76,"g":"Endung -dad: meist weiblich (la)."},{"w":"quién","p":"pronombre","r":77},{"w":"alguno","p":"determinante","r":78},{"w":"tiempo","p":"sustantivo","r":79,"g":"El tiempo = Zeit oder Wetter. Hace buen tiempo = das Wetter ist schön.","t":"Zeit, Wetter","e":"No tengo tiempo hoy.","d":"Ich habe heute keine Zeit.","e2":"Con el tiempo uno aprende a no preocuparse por todo.","d2":"Mit der Zeit lernt man, sich nicht über alles zu sorgen."},{"w":"buen","p":"adjetivo","r":80,"g":"Eine Form für männlich und weiblich, Plural +s/+es."},{"w":"necesitar","p":"verbo","r":81,"c":[["necesito","necesitas","necesita","necesitamos","necesitan"],["necesité","necesitaste","necesitó","necesitamos","necesitaron"],0],"g":"Regelmäßiges Verb auf -ar.","t":"brauchen","e":"Necesito más tiempo.","d":"Ich brauche mehr Zeit.","e2":"Necesitamos que alguien se haga cargo del proyecto.","d2":"Wir brauchen jemanden, der das Projekt übernimmt."},{"w":"nunca","p":"adverbio","r":82,"t":"nie","e":"Nunca tomo café por la n
